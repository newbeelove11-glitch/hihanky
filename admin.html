input:focus{outline:none;border-color:var(--accent)}
.login{max-width:380px;margin:12vh auto;display:grid;gap:10px}
.err{color:var(--bad);min-height:1.2em;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile small{color:var(--muted);display:block}.tile b{font-size:30px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.chart{position:relative}
.chart svg{width:100%;height:220px;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

</style>
